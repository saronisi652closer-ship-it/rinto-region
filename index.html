<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ミトモン</title>

<style>
*{ box-sizing:border-box; }

html,body{
  margin:0;
  width:100%;
  height:100%;
  font-family:sans-serif;
  overflow:hidden;
}

body{
  color:white;
  background:
    radial-gradient(circle at 20% 20%, rgba(95,240,204,.25), transparent 25%),
    radial-gradient(circle at 80% 15%, rgba(255,216,77,.18), transparent 25%),
    linear-gradient(160deg,#06142f,#0d2f6f 45%,#0a5d87 75%,#149b96);
}

/* ★ 背景レイヤー全部にpointer-events:none を追加 */
.grid, .ring, #particles, .particle {
  pointer-events: none;
}

.screen{
  position:absolute;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
  /* ★ ボタンが確実にタップできるようz-indexを設定 */
  z-index:1;
}

.grid{
  position:absolute;
  inset:0;
  background-image:
    linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px);
  background-size:34px 34px;
  animation:gridMove 18s linear infinite;
  opacity:.35;
  z-index:0;
}

.ring{
  position:absolute;
  width:72vmin;
  height:72vmin;
  border-radius:50%;
  border:1px solid rgba(255,255,255,.18);
  box-shadow:0 0 40px rgba(95,240,204,.18);
  z-index:0;
}

.card{
  position:relative;
  z-index:2;
  width:min(92vw,560px);
  padding:28px 22px;
  border-radius:30px;
  text-align:center;
  background:linear-gradient(180deg,rgba(8,18,44,.6),rgba(7,15,36,.82));
  border:1px solid rgba(255,255,255,.18);
  box-shadow:0 18px 48px rgba(0,0,0,.38);
  backdrop-filter:blur(14px);
}

.logo-wrap{
  position:relative;
  margin:0 auto 20px;
  animation:logoFloat 3s ease-in-out infinite;
}

.logo-glow{
  position:absolute;
  left:10%;
  right:10%;
  bottom:4%;
  height:28%;
  background:radial-gradient(ellipse,rgba(95,240,204,.45),transparent 70%);
  filter:blur(20px);
  z-index:-1;
  pointer-events:none;
}

.logo{
  width:100%;
  max-width:520px;
  filter:drop-shadow(0 18px 24px rgba(0,0,0,.35));
}

.subtitle{
  margin:8px 0 22px;
  color:#c9e8ff;
  font-size:14px;
  letter-spacing:.08em;
}

.btn{
  width:100%;
  padding:16px;
  border:none;
  border-radius:18px;
  font-size:18px;
  font-weight:bold;
  color:#08224f;
  background:linear-gradient(180deg,#fff2a8,#ffd84d);
  box-shadow:0 10px 20px rgba(255,216,77,.25);
  cursor:pointer;
  /* ★ ボタンは確実にタップ受け取る */
  position:relative;
  z-index:10;
}

.btn.secondary{
  background:linear-gradient(180deg,#78efd6,#48cab7);
  margin-top:12px;
}

.hint{
  margin-top:18px;
  font-size:12px;
  color:#c9e8ff;
  letter-spacing:.12em;
  animation:blink 1.7s infinite;
}

#nameScreen .card{ max-width:430px; }

input{
  width:100%;
  padding:14px;
  margin:16px 0;
  border:none;
  border-radius:14px;
  font-size:20px;
  text-align:center;
}

.hidden{ display:none; }

.particle{
  position:absolute;
  width:7px;
  height:7px;
  border-radius:50%;
  background:rgba(95,240,204,.8);
  box-shadow:0 0 12px rgba(95,240,204,.8);
  animation:floatUp linear infinite;
  pointer-events:none;
  z-index:0;
}

@keyframes logoFloat{
  0%,100%{ transform:translateY(0); }
  50%{ transform:translateY(-7px); }
}
@keyframes blink{
  0%,100%{ opacity:.35; }
  50%{ opacity:1; }
}
@keyframes gridMove{
  from{ transform:translateY(0); }
  to{ transform:translateY(34px); }
}
@keyframes floatUp{
  from{ transform:translateY(30px); opacity:0; }
  20%{ opacity:1; }
  to{ transform:translateY(-110vh); opacity:0; }
}
</style>
</head>

<body>

<div class="grid"></div>
<div class="ring"></div>
<div id="particles"></div>

<!-- タイトル -->
<div id="title" class="screen">
  <div class="card">
    <div class="logo-wrap">
      <div class="logo-glow"></div>
      <img src="logo.png" class="logo" alt="ミトモン">
    </div>
    <div class="subtitle">Mitnehmen Monster - ミトモン -</div>
    <button class="btn" onclick="startGame()">はじめる</button>
    <div class="hint">PRESS START</div>
  </div>
</div>

<!-- 名前入力 -->
<div id="nameScreen" class="screen hidden">
  <div class="card">
    <h2>なまえを入力</h2>
    <input id="playerName" type="text" maxlength="8" placeholder="なまえ">
    <button class="btn" onclick="goToPlay()">けってい</button>
    <button class="btn secondary" onclick="goBack()">もどる</button>
  </div>
</div>

<script>
// パーティクル生成
(function(){
  const container = document.getElementById('particles');
  for(let i = 0; i < 18; i++){
    const p = document.createElement('div');
    p.className = 'particle';
    p.style.left = Math.random()*100 + 'vw';
    p.style.bottom = '-10px';
    p.style.animationDuration = (6 + Math.random()*10) + 's';
    p.style.animationDelay = (Math.random()*8) + 's';
    p.style.opacity = 0;
    container.appendChild(p);
  }
})();

function startGame(){
  document.getElementById('title').classList.add('hidden');
  document.getElementById('nameScreen').classList.remove('hidden');
}

function goBack(){
  document.getElementById('nameScreen').classList.add('hidden');
  document.getElementById('title').classList.remove('hidden');
}

function goToPlay(){
  const name = document.getElementById('playerName').value.trim();
  if(!name){ 
    alert('なまえを入力してね！');
    return; 
  }
  localStorage.setItem('playerName', name);
  window.location.href = './play.html';
}

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('./service-worker.js');
}
</script>

</body>
</html>
