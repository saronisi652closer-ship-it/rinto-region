<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ミトモン</title>

<style>
body{
  margin:0;
  font-family: sans-serif;
  background: linear-gradient(180deg,#0a1a2f,#123c5c);
  color:white;
  overflow:hidden;
}

/* 共通 */
.screen{
  position:absolute;
  width:100%;
  height:100%;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}

/* ロゴ */
.logo{
  width:80%;
  max-width:400px;
  margin-bottom:20px;
}

/* ボタン */
.btn{
  padding:12px 30px;
  background:#00c2ff;
  border:none;
  border-radius:20px;
  color:white;
  font-size:18px;
  margin-top:20px;
}

/* 入力 */
input{
  padding:10px;
  font-size:18px;
  border-radius:10px;
  border:none;
  text-align:center;
}

/* 非表示 */
.hidden{
  display:none;
}

/* 軽いアニメ */
.fade{
  animation:fade 0.5s;
}

@keyframes fade{
  from{opacity:0}
  to{opacity:1}
}
</style>
</head>

<body>

<!-- タイトル画面 -->
<div id="title" class="screen fade">

  <!-- ★ロゴ（ここに差し替えOK） -->
  <img src="logo.png" class="logo">

  <h1>ミトモン</h1>

  <button class="btn" onclick="startGame()">はじめる</button>

</div>

<!-- 名前入力 -->
<div id="nameScreen" class="screen hidden">

  <h2>なまえを入力</h2>

  <input id="playerName" placeholder="なまえ">

  <button class="btn" onclick="confirmName()">決定</button>

</div>

<!-- ゲーム開始（仮） -->
<div id="gameScreen" class="screen hidden">

  <h2 id="welcome"></h2>

  <p>冒険がはじまる…</p>

</div>

<script>

function startGame(){
  document.getElementById("title").classList.add("hidden");
  document.getElementById("nameScreen").classList.remove("hidden");
}

function confirmName(){
  let name = document.getElementById("playerName").value;

  if(name === ""){
    alert("名前を入力して！");
    return;
  }

  document.getElementById("nameScreen").classList.add("hidden");
  document.getElementById("gameScreen").classList.remove("hidden");

  document.getElementById("welcome").innerText =
    name + " の冒険がはじまる！";
}

</script>

</body>
</html>
