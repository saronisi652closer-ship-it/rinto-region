<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <title>ミトモン</title>

  <link rel="stylesheet" href="./style.css" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <meta name="theme-color" content="#000000" />

  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
</head>

<body>
  <div id="stage">
    <canvas id="game" width="240" height="160"></canvas>
  </div>

  <!-- プレイヤー名表示（位置は pad.js が調整） -->
  <div id="playerHud">主人公：---</div>

  <!-- 入力の共通層 → 仮想パッドUI → ゲーム本体 の順に読み込む -->
  <script src="./input.js"></script>
  <script src="./pad.js"></script>
  <script src="./game.js"></script>

  <script>
    const playerName = localStorage.getItem("playerName");
    if (playerName) {
      document.getElementById("playerHud").textContent = "主人公：" + playerName;
    }

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./service-worker.js");
    }
  </script>
</body>
</html>
